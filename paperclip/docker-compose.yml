services:
  paperclip:
    image: "ghcr.io/paperclipai/paperclip:latest"
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_DB_USER}:${PAPERCLIP_DB_PASSWORD:-paperclip}@postgres:5432/paperclip"
      PORT: "3100"
      SERVE_UI: "true"
      # authenticated+private is the safe default: every page needs login,
      # and the instance is not reachable until fronted by the shared proxy.
      PAPERCLIP_DEPLOYMENT_MODE: "${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "${PAPERCLIP_DEPLOYMENT_EXPOSURE:-private}"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      # Required — generate with: openssl rand -hex 32
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      # Signs approval-gated tool actions; optional but recommended in prod.
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:-}"
    volumes:
      - paperclip-data:/paperclip
    networks:
      - hq-postgres
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # Owned by ../postgres/docker-compose.yml; this stack only joins it.
  # Bring postgres/ up first (or at least once) so the role/db from its
  # init script exist before paperclip tries to connect.
  hq-postgres:
    external: true

volumes:
  paperclip-data:
