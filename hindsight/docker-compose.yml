services:
  hindsight-api:
    image: "ghcr.io/vectorize-io/hindsight-api:latest"
    restart: unless-stopped
    expose:
      - "8888"
    environment:
      HINDSIGHT_API_DATABASE_URL: "postgresql://${POSTGRES_DB_PASSWORD}:${POSTGRES_DB_PASSWORD}@postgres:5432/hindsight"
      # "none" runs Hindsight as a semantic-only store on bundled local
      # models. Set a provider + key below to enable fact extraction/reflect.
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_API_LLM_PROVIDER:-none}"
      HINDSIGHT_API_LLM_API_KEY: "${HINDSIGHT_API_LLM_API_KEY:-}"
      # Required — bearer token every REST/MCP request must present.
      HINDSIGHT_API_TENANT_API_KEY: "${HINDSIGHT_API_TENANT_API_KEY:?HINDSIGHT_API_TENANT_API_KEY must be set}"
      # A dedicated worker container handles retain/consolidation jobs.
      HINDSIGHT_API_WORKER_ENABLED: "false"
    networks:
      - hq-postgres
    healthcheck:
      # /health/live performs no DB access (liveness only) — see
      # https://hindsight.vectorize.io/developer/monitoring
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hindsight-worker:
    image: "ghcr.io/vectorize-io/hindsight-api:latest"
    command: ["hindsight-worker", "--worker-id", "worker-1"]
    restart: unless-stopped
    environment:
      HINDSIGHT_API_DATABASE_URL: "postgresql://${POSTGRES_DB_USER}:${POSTGRES_DB_PASSWORD}@postgres:5432/hindsight"
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_API_LLM_PROVIDER:-none}"
      HINDSIGHT_API_LLM_API_KEY: "${HINDSIGHT_API_LLM_API_KEY:-}"
    networks:
      - hq-postgres
    depends_on:
      - hindsight-api

  hindsight-control-plane:
    image: "ghcr.io/vectorize-io/hindsight-control-plane:latest"
    restart: unless-stopped
    expose:
      - "9999" # Dashboard UI
    environment:
      HINDSIGHT_CP_ACCESS_KEY: "${HINDSIGHT_CP_ACCESS_KEY:-}"
      HINDSIGHT_CP_DATAPLANE_API_URL: "http://hindsight-api:8888"
    depends_on:
      - hindsight-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # Owned by ../postgres/docker-compose.yml; this stack only joins it.
  # Bring postgres/ up first (or at least once) so the role/db from its
  # init script exist before hindsight tries to connect.
  hq-postgres:
    external: true
