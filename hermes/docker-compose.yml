services:
  hermes:
    image: "nousresearch/hermes-agent:latest"
    restart: unless-stopped
    # Keep Hermes private; only the Workspace service receives a Coolify domain.
    expose:
      - "8642"
      - "9119"
    volumes:
      - hermes-data:/opt/data
    environment:
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_KEY: "${API_SERVER_KEY:?Set API_SERVER_KEY in Coolify}"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_CORS_ORIGINS: "*"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_USERNAME:-admin}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_PASSWORD:?Set HERMES_PASSWORD in Coolify}"
      HERMES_UID: '10010'
      HERMES_DASHBOARD: '1'
    command: ["gateway", "run"]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8642/health && curl -fsS http://127.0.0.1:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - workspace-files:/workspace
      - hermes-data:/home/workspace/.hermes
    environment:
      HERMES_API_URL: http://hermes:8642 
      HERMES_DASHBOARD_URL: http://hermes:9119
      HERMES_API_TOKEN: "${API_SERVER_KEY:?Set API_SERVER_KEY in Coolify}"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_PASSWORD: "${HERMES_PASSWORD:?Set HERMES_PASSWORD in Coolify}"
      COOKIE_SECURE: '1'
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      HOST: 0.0.0.0
      NODE_ENV: production
      GATEWAY_ALLOW_ALL_USERS: true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace-files:
  hermes-data:
