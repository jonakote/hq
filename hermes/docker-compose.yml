services:
  hermes:
    image: "nousresearch/hermes-agent:latest"
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ~/.hermes:/opt/data
    env:
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: "${API_SERVER_KEY:-}"
      API_SERVER_CORS_ORIGINS: "*"
      HERMES_UID: '10010'
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health && curl -fsS http://localhost:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: hermes-workspace
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - workspace-files:/workspace
      - ~/.hermes:/home/workspace/.hermes
    environment:
      HERMES_API_URL: http://hermes-agent:8642 
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      HERMES_API_TOKEN: "${API_SERVER_KEY}"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health && curl -fsS http://localhost:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace-files: