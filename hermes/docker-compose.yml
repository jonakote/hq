services:
  hermes-agent:
    image: "nousresearch/hermes-agent:latest"
    restart: unless-stopped
    command: ["gateway", "run"]
    expose:
      - "8642"
      - "9119"
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10010"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: "127.0.0.1"
      # API_SERVER_KEY: "${API_SERVER_KEY:-}"
      API_SERVER_CORS_ORIGINS: "*"
      # HERMES_DASHBOARD_OAUTH_CLIENT_ID: "${HERMES_DASHBOARD_OAUTH_CLIENT_ID:-}"
      # HERMES_DASHBOARD_PUBLIC_URL: "${HERMES_DASHBOARD_PUBLIC_URL:-}"
      # HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}"
      # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}"
      # HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8642/health && curl -fsS http://localhost:9119/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-workspace:
    image: "ghcr.io/outsourc-e/hermes-workspace:latest"
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - workspace-files:/workspace
      - hermes-data:/home/workspace/.hermes
    environment:
      HERMES_API_URL: http://hermes-agent:8642
      # HERMES_API_TOKEN: "${API_SERVER_KEY:-}"
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      # HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}"
      # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}"
      HERMES_PASSWORD: "${HERMES_PASSWORD:-}"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      HOST: 0.0.0.0
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace-files:
  hermes-data:
