services:
  hermes-agent:
    image: "nousresearch/hermes-agent:latest"
    command: ["gateway", "run"]
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10010"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_KEY: "${API_SERVER_KEY:-}"
      API_SERVER_CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health && curl -fsS http://127.0.0.1:9119/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-workspace:
    image: "ghcr.io/outsourc-e/hermes-workspace:latest"
    network_mode: "service:hermes-agent"
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
    volumes:
      - workspace-files:/workspace
      - hermes-data:/home/workspace/.hermes
    environment:
      HERMES_API_URL: http://127.0.0.1:8642
      HERMES_API_TOKEN: "${API_SERVER_KEY:-}"
      HERMES_DASHBOARD_URL: http://127.0.0.1:9119
      HERMES_PASSWORD: "${HERMES_PASSWORD:-}"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      HOST: "0.0.0.0"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hermes-data:
  workspace-files:
