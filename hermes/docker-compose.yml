services:
  hermes:
    image: "nousresearch/hermes-agent:latest"
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - hermes-data:/opt/data
    environment:
      API_SERVER_ENABLED: "${API_SERVER_ENABLED:-true}"
      API_SERVER_KEY: "${API_SERVER_KEY:-1234567890}"
      API_SERVER_CORS_ORIGINS: "*"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_UID: '10010'
      HERMES_DASHBOARD: '1'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8642/health && curl -fsS http://127.0.0.1:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-workspace:
    image: ghcr.io/outsourc-e/hermes-workspace:latest
    container_name: hermes-workspace
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - workspace-files:/workspace
      - hermes-data:/home/workspace/.hermes
    environment:
      HERMES_API_URL: http://hermes-agent:8642 
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      HERMES_API_TOKEN: "${API_SERVER_KEY}"
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace-files:
  hermes-data: